name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.test.mjs'
      - '.gitignore'
      - 'package.json'
      - 'scripts/repo-scope.mjs'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**.mjs'
      - 'assets/**'
      - 'scripts/build-*.py'
      - 'scripts/build-pet-walk-map.mjs'
      - 'package.json'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build static image assets
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          python -m pip install --disable-pip-version-check Pillow PyMuPDF fonttools
          noto_font_path="$(fc-match -f '%{file}' 'Noto Sans CJK SC')"
          test -n "$noto_font_path"
          python scripts/build-card-glyphs.py --cjk-font "$noto_font_path"
          python scripts/build-nickname-glyphs.py --font "$noto_font_path"
          python scripts/build-emoji-sprites.py
          python scripts/build-equipment-art.py
          python scripts/build-static-art.py

      - name: Verify static assets and image renderers
        run: |
          npm run test:assets
          npm run test:lantern
          npm run test:tavern
          npm run test:chat
          node --import=./test-static-assets.mjs --test ugc-context.test.mjs
          npm run test:worker

      - name: Deploy discord-holdem
        if: github.event_name != 'pull_request'
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

